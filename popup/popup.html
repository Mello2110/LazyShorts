<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LazyShorts</title>
  <link rel="stylesheet" href="../styles/design-system.css">
  <link rel="stylesheet" href="popup.css">
</head>

<body class="popup">
  <div class="popup__header">
    <img src="../assets/logo-small.png" alt="LazyShorts Logo" class="popup__logo">
    <h1 class="popup__title">LazyShorts</h1>
  </div>

  <div class="popup__body">
    <label class="toggle">
      <input type="checkbox" class="toggle__input" id="enableToggle" aria-label="Enable auto-skip">
      <span class="toggle__slider"></span>
      <span class="toggle__label">Auto-skip enabled</span>
    </label>
  </div>

  <div class="popup__stats">
    <span class="popup__stats-label">Shorts skipped:</span>
    <span class="popup__stats-value" id="skipCountDisplay">0</span>
  </div>

  <div class="popup__actions">
    <button class="popup__button popup__button--icon" id="settingsBtn" aria-label="Open settings">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M17.43 10.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C12.46.19 12.25 0 12 0h-4c-.25 0-.46.19-.49.44l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.25.24.44.49.44h4c.25 0 .46-.19.49-.44l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM10 13.5c-1.93 0-3.5-1.57-3.5-3.5S8.07 6.5 10 6.5s3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" />
      </svg>
    </button>
    <button class="popup__button popup__button--icon" id="coffeeBtn" aria-label="Support developer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M18 6h-2V4c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v7c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-1h2c1.1 0 2-.9 2-2s-.9-2-2-2zm-4 5c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V4h10v7zm2-3h-2V8h2v2z" />
        <path d="M4 18h12v2H4z" />
      </svg>
    </button>
  </div>

  <footer class="popup__footer">
    <span class="popup__credit">by <a href="https://mello2110.github.io/LandingpageMellowSolutions/" target="_blank"
        rel="noopener noreferrer" class="popup__credit-link">Mellow Solutions</a></span>
  </footer>

  <script src="popup.js"></script>
</body>

</html>
