<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LazyShorts</title>
  <link rel="stylesheet" href="../styles/design-system.css">
  <link rel="stylesheet" href="popup.css">
</head>

<body class="popup">
  <!-- Header -->
  <header class="popup__header">
    <div class="popup__brand">
      <img src="../icons/logo-small.png" alt="LazyShorts Logo" class="popup__logo">
      <div class="popup__titles">
        <h1 class="popup__title">LazyShorts</h1>
        <div class="popup__status" id="statusPill" title="Status on active tab">
          <span class="popup__status-dot popup__status-dot--inactive" id="statusDot"></span>
          <span class="popup__status-text" id="statusText">Checking...</span>
        </div>
      </div>
    </div>
    <div class="popup__header-actions">
      <button class="popup__icon-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
        <!-- Sun icon (shown in dark mode) -->
        <svg class="popup__icon popup__icon--sun" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg class="popup__icon popup__icon--moon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
        </svg>
      </button>
      <button class="popup__icon-btn" id="settingsBtn" aria-label="Open settings" title="Open settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.44.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Body Content -->
  <main class="popup__body">
    <!-- Hero Card: Master Switch -->
    <div class="popup__card popup__card--hero">
      <div class="popup__card-info">
        <span class="popup__card-title">Auto-Advance</span>
        <span class="popup__card-subtitle" id="masterToggleDesc">Advances automatically when video ends</span>
      </div>
      <label class="toggle" for="enableToggle">
        <input type="checkbox" class="toggle__input" id="enableToggle" aria-label="Enable auto-advance">
        <span class="toggle__slider"></span>
      </label>
    </div>

    <!-- Quick Action: Skip Now -->
    <button type="button" class="popup__quick-skip" id="quickSkipBtn" title="Immediately skip to next video">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5 4 15 12 5 20 5 4"></polygon>
        <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
      </svg>
      <span>Next Video Now</span>
    </button>

    <!-- Dislike / Not Interested Card -->
    <div class="popup__card">
      <div class="popup__card-info">
        <span class="popup__card-title">Skip on Dislike / "Not Interested"</span>
        <span class="popup__card-subtitle">Auto-skips when using 3-dots menu or dislike</span>
      </div>
      <label class="toggle" for="skipOnDislikeToggle">
        <input type="checkbox" class="toggle__input" id="skipOnDislikeToggle" aria-label="Skip on dislike or not interested">
        <span class="toggle__slider"></span>
      </label>
    </div>

    <!-- Delay Control Card -->
    <div class="popup__card popup__card--delay">
      <div class="popup__delay-header">
        <span class="popup__card-title">Skip Delay</span>
        <span class="popup__delay-badge"><strong id="delayValue">0</strong>s</span>
      </div>
      <input type="range" id="delayRange" class="popup__range" min="0" max="5" step="1" value="0" aria-label="Delay in seconds">
      <div class="popup__delay-presets">
        <button type="button" class="popup__preset-chip" data-delay="0">0s (Instant)</button>
        <button type="button" class="popup__preset-chip" data-delay="1">1s</button>
        <button type="button" class="popup__preset-chip" data-delay="2">2s</button>
        <button type="button" class="popup__preset-chip" data-delay="3">3s</button>
        <button type="button" class="popup__preset-chip" data-delay="5">5s</button>
      </div>
    </div>

    <!-- Stats Card -->
    <div class="popup__stats-card">
      <div class="popup__stats-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
      </div>
      <div class="popup__stats-text">
        <span class="popup__stats-label">Shorts auto-skipped</span>
        <span class="popup__stats-number" id="skipCountDisplay">0</span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="popup__footer">
    <span class="popup__credit">by <a href="https://mello2110.github.io/LandingpageMellowSolutions/" target="_blank"
        rel="noopener noreferrer" class="popup__credit-link">Mellow Solutions</a></span>
    <a href="https://buymeacoffee.com/mellowsolutions" target="_blank" rel="noopener noreferrer"
      class="popup__coffee-link" aria-label="Support Developer" title="Buy me a coffee ☕">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M20 8h-2V6c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v9c0 2.76 2.24 5 5 5h4c2.76 0 5-2.24 5-5v-1h2c1.1 0 2-.9 2-2s-.9-2-2-2zm-4 7c0 1.65-1.35 3-3 3H9c-1.65 0-3-1.35-3-3V6h10v9zm2-4h-2v-2h2v2z" />
        <path d="M6 20h12v2H6z" />
      </svg>
      <span>Support</span>
    </a>
  </footer>

  <!-- Toast notification -->
  <div class="popup__toast" id="toast" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>

</html>
